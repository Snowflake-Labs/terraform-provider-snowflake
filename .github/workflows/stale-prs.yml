# Marks inactive pull requests as stale and closes them if they stay inactive.
# Issues are intentionally not processed by this workflow.
name: Mark and close stale PRs

on:
  schedule:
    - cron: "0 6 * * *" # every day at 8:00 AM CEST time
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # Only pull requests are processed; setting the issue values to -1 disables issue handling.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            any activity in the last 30 days. It will be closed in 7 days if no further
            activity occurs. Thank you for your contribution!
          close-pr-message: >
            This pull request has been automatically closed because it has not had any
            activity since it was marked as stale. Feel free to reopen it if you would like
            to continue working on it.
          delete-branch: false
